<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Review | Fixzeers</title><link rel="stylesheet" href="styles.css"></head><body>
<nav class="nav"><div class="container nav-inner"><a class="logo" href="index.html">Fix<span>zeers</span></a><div class="nav-links"><a href="search.html">Find a Pro</a><a href="my-jobs.html">My Requests</a><a href="how-it-works.html">How it works</a><a href="help.html">Help</a></div><div class="nav-actions" id="navActions"></div><button class="menu" aria-label="Menu">☰</button></div></nav>
<main class="page"><div class="container"><div class="form-card"><span class="kicker">Verified feedback</span><h1 style="font-size:38px">Leave a review</h1><p id="reviewInfo" class="muted">Loading job...</p>
<form id="reviewForm"><label>Rating</label><select id="rating" required><option value="">Choose a rating</option><option value="5">5 — Excellent</option><option value="4">4 — Good</option><option value="3">3 — Okay</option><option value="2">2 — Poor</option><option value="1">1 — Very poor</option></select><label>Your review</label><textarea id="comment" rows="5" maxlength="2000" placeholder="How was your experience?" required></textarea><button class="btn btn-primary" type="submit">Submit verified review</button></form>
<div id="reviewState" class="notice" style="margin-top:16px;display:none"></div></div></div></main><div class="toast"></div><script src="app.js"></script><script>
(async()=>{const token=getToken(),jobId=new URLSearchParams(location.search).get("jobId");if(!token){location.href="login.html";return;}if(!jobId){document.getElementById("reviewForm").style.display="none";document.getElementById("reviewInfo").textContent="No job was selected.";return;}
try{const data=await api("/jobs/"+encodeURIComponent(jobId),{headers:{Authorization:"Bearer "+token}});const j=data.job;document.getElementById("reviewInfo").textContent=`Review ${j.professional_name||"your professional"} for “${j.title||"this service"}”. Status: ${(j.status||"").replaceAll("_"," ")}`;
if(j.status!=="customer_confirmed"){document.getElementById("reviewForm").style.display="none";document.getElementById("reviewInfo").textContent+=" A review is available after you confirm completion.";return;}
}catch(e){document.getElementById("reviewForm").style.display="none";document.getElementById("reviewInfo").textContent="Unable to load this job.";return;}
document.getElementById("reviewForm").onsubmit=async e=>{e.preventDefault();const state=document.getElementById("reviewState");try{await api("/reviews/"+encodeURIComponent(jobId),{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({rating:Number(document.getElementById("rating").value),comment:document.getElementById("comment").value.trim()})});state.style.display="block";state.textContent="Review submitted successfully. Thank you for helping build trustworthy professional reputations.";document.getElementById("reviewForm").style.display="none";}catch(err){state.style.display="block";state.textContent=err.message||"Could not submit the review.";}};})();
</script></body></html>
