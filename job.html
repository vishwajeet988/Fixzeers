<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Job Details | Fixzeers</title><link rel="stylesheet" href="styles.css"></head><body>
<nav class="nav"><div class="container nav-inner"><a class="logo" href="index.html">Fix<span>zeers</span></a><div class="nav-links"><a href="search.html">Find a Pro</a><a href="my-jobs.html">My Requests</a><a href="how-it-works.html">How it works</a><a href="help.html">Help</a></div><div class="nav-actions" id="navActions"></div><button class="menu" aria-label="Menu">☰</button></div></nav>
<main class="page"><div class="container"><div class="page-title"><span class="kicker">Service request</span><h1 id="jobTitle">Loading...</h1><p class="lead" id="jobSubtitle"></p></div><div id="jobState" class="card">Loading job details...</div><div id="jobContent" style="display:none"><div class="grid grid-3"><div class="card"><span class="muted">Status</span><h2 id="jobStatus">—</h2></div><div class="card"><span class="muted">Professional</span><h3 id="professional">—</h3></div><div class="card"><span class="muted">Scheduled</span><p id="scheduled">—</p></div></div><div class="card" style="margin-top:20px"><h3>Request details</h3><p><strong>Category:</strong> <span id="category">—</span></p><p><strong>Address:</strong> <span id="address">—</span></p><p><strong>Description:</strong></p><p id="description" class="muted">—</p><div id="actions" class="row" style="margin-top:20px"></div></div></div></div></main>
<div class="toast"></div><script src="app.js"></script><script>
(async()=>{const token=getToken();const id=new URLSearchParams(location.search).get("id");if(!token){location.href="login.html";return;}if(!id){document.getElementById("jobState").textContent="No job was selected.";return;}
const headers={Authorization:"Bearer "+token};try{const data=await api("/jobs/"+encodeURIComponent(id),{headers});const j=data.job;
document.getElementById("jobState").style.display="none";document.getElementById("jobContent").style.display="block";document.getElementById("jobTitle").textContent=j.title||"Service request";document.getElementById("jobSubtitle").textContent=(j.category||"Service")+" · "+(j.status||"requested").replaceAll("_"," ");
document.getElementById("jobStatus").textContent=(j.status||"requested").replaceAll("_"," ");document.getElementById("professional").textContent=j.professional_name||"—";
document.getElementById("scheduled").textContent=j.scheduled_at?new Date(j.scheduled_at).toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"short"}):"Not scheduled";
document.getElementById("category").textContent=j.category||"—";document.getElementById("address").textContent=j.address||"Not provided";document.getElementById("description").textContent=j.description||"No description provided.";
const actions=document.getElementById("actions");
if(j.status==="completed") actions.innerHTML='<button class="btn btn-primary" id="confirmBtn">Confirm completion</button>';
else if(j.status==="customer_confirmed") actions.innerHTML='<a class="btn btn-primary" href="review.html?jobId='+encodeURIComponent(j.id)+'">Leave a review</a>';
else if(j.status==="requested") actions.innerHTML='<button class="btn btn-light" id="cancelBtn">Cancel request</button>';
if(document.getElementById("confirmBtn"))document.getElementById("confirmBtn").onclick=async()=>{try{await api("/jobs/"+encodeURIComponent(id)+"/status",{method:"PATCH",headers:{"Content-Type":"application/json",...headers},body:JSON.stringify({status:"customer_confirmed"})});location.reload();}catch(e){toast(e.message||"Could not confirm completion");}};
if(document.getElementById("cancelBtn"))document.getElementById("cancelBtn").onclick=async()=>{if(!confirm("Cancel this service request?"))return;try{await api("/jobs/"+encodeURIComponent(id)+"/status",{method:"PATCH",headers:{"Content-Type":"application/json",...headers},body:JSON.stringify({status:"cancelled"})});location.reload();}catch(e){toast(e.message||"Could not cancel request");}};
}catch(e){document.getElementById("jobState").textContent="Unable to load this job. Please return to My Requests.";}})();
</script></body></html>
